name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --all-features

  feature-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check each feature without defaults
        run: |
          set -euo pipefail
          cargo check --no-default-features
          features="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "nmea-0183-rs") | .features | keys[] | select(. != "default")')"
          while IFS= read -r feature; do
            cargo check --no-default-features --features "$feature"
          done <<< "$features"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Document supported feature configurations
        run: |
          set -euo pipefail
          for features in all no-default nmea ais abm bbm; do
            case "$features" in
              all) cargo doc --all-features --no-deps ;;
              no-default) cargo doc --no-default-features --no-deps ;;
              *) cargo doc --no-default-features --features "$features" --no-deps ;;
            esac
          done
        env:
          RUSTDOCFLAGS: -D warnings
