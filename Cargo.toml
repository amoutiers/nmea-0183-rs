[package]
name = "nmea-0183-rs"
version = "0.9.1"
edition = "2024"
rust-version = "1.85.0"
description = "Continuation of nmea-kit: bidirectional NMEA 0183 parser and encoder with AIS decoding and transponder-message encoding"
license = "MIT OR Apache-2.0"
authors = ["Antoine MOUTIERS"]
readme = "README.md"
repository = "https://github.com/amoutiers/nmea-0183-rs"
homepage = "https://github.com/amoutiers/nmea-0183-rs"
documentation = "https://docs.rs/nmea-0183-rs"
keywords = ["nmea", "ais", "gps", "marine", "navigation"]
categories = ["parser-implementations", "science::geo", "network-programming", "encoding"]
exclude = ["/tests/", "/.github/", "/.githooks/", "/AGENTS.md", "/SECURITY.md"]

[dependencies]

[features]
default = ["nmea", "nmea_proprietary", "ais"]

# Standard NMEA sentence categories
position         = ["dtm", "gga", "gll", "gns", "rma", "rmb", "rmc"]
satellites       = ["gbs", "grs", "gsa", "gst", "gsv"]
heading          = ["hdg", "hdm", "hdt", "hsc", "ths"]
course_speed     = ["osd", "rot", "vbw", "vdr", "vhw", "vlw", "vpw", "vtg", "wcv"]
wind             = ["mwd", "mwv", "vwr", "vwt"]
depth            = ["dbk", "dbs", "dbt", "dpt"]
steering         = ["apb", "rpm", "rsa"]
waypoints_routes = ["aam", "bec", "bod", "bwc", "bwr", "bww", "rte", "wpl", "xte"]
environment      = ["mda", "mta", "mtw", "xdr"]
time             = ["zda"]
targets          = ["rsd", "tlb", "tll", "ttd", "ttm"]
safety_alarms    = ["ack", "acn", "ala", "alc", "alf", "alr", "arc", "dor", "dsc", "dse", "eve", "fir", "hbt"]
communication    = ["txt"]

# Umbrella features
nmea = [
    "position", "satellites", "heading", "course_speed", "wind", "depth",
    "steering", "waypoints_routes", "environment", "time", "targets",
    "safety_alarms", "communication", "vsd",
]
nmea_proprietary = [
    "pashr", "pcdin", "pgrme", "pgrmt", "phtro", "pklid", "pklds", "pklsh",
    "pknds", "pknid", "pknsh", "pkwdwpl", "pmtk", "prdid", "psoncms", "pskpdpt",
]
ais = ["abm", "bbm", "vsd"]

