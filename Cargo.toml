[package]
name = "nmea-kit"
version = "0.8.3"
edition = "2024"
rust-version = "1.85.0"
description = "Bidirectional NMEA 0183 parser and encoder with AIS decoding"
license = "MIT OR Apache-2.0"
authors = ["Antoine MOUTIERS"]
readme = "README.md"
repository = "https://github.com/amoutiers/nmea-kit"
homepage = "https://github.com/amoutiers/nmea-kit"
documentation = "https://docs.rs/nmea-kit"
keywords = ["nmea", "ais", "gps", "marine", "navigation"]
categories = ["parser-implementations", "science::geo", "network-programming", "encoding"]
exclude = ["/tests/"]

[dependencies]

[features]
default = ["nmea", "ais"]

# Semantic groups
positioning = ["gga", "gll", "rmc", "gns"]
speed       = ["vtg", "vhw", "vbw", "rmc", "rpm", "vdr"]
heading     = ["hdg", "hdm", "hdt", "ths"]
wind        = ["mwd", "mwv"]
depth       = ["dbt", "dbs", "dbk", "dpt"]

# Umbrella — all sentence types
nmea = [
    "positioning", "speed", "heading", "wind", "depth",
    "aam", "ack", "acn", "ala", "alc", "alf", "alr", "arc", "apb", "bec", "bod", "bwc", "bwr", "bww", "dor", "dsc", "dse", "dtm", "eve", "fir", "gbs", "gsa", "gsv", "gst", "hbt", "hsc", "mda", "mta", "mtw", "osd", "pashr", "pgrme", "pskpdpt", "rmb", "rot", "rpm", "rsa", "rsd", "rte", "tll", "ttm", "txt", "vdr", "vlw", "vpw", "vwr", "vwt", "vsd", "wcv", "wpl", "xdr", "xte", "zda",
]
ais = ["abm", "bbm"]

